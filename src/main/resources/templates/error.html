<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/non-specific/background-slideshow.css">
    <title>404 - Page Not Found</title>
    <style>
        /* General reset and font setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        /* Main container for the error page */
        .error-container {
            z-index: 100;
            text-align: center;
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        /* Styling for the error code */
        .error-container h1 {
            font-size: 120px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        /* Message under the error code */
        .error-container p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .fade-image {
            z-index: 10;
        }

        .content-container {
            position: relative;
            z-index: 100;
        }


        /* Button for navigation */
        .home-btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            text-decoration: none;
            background-color: #3498db;
            color: #fff;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .home-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="overlay"></div>
        <img class="fade-image" src="/images/palm%20oil.jpg" alt="Palm Oil">
        <img class="fade-image" src="/images/rainforest3.jpg" alt="Rainforest Image">
        <img class="fade-image" src="/images/rainforest1.jpg" alt="Rainforest Image">
        <img class="fade-image" src="/images/rainforest2.jpg" alt="Rainforest Image">
        <div class="content-container">
            <div class="error-container">
                <h1>404</h1>
                <p>Oops! The page you're looking for doesn't exist.</p>
                <a href="/" class="home-btn">Go to Homepage</a>
            </div>
        </div>
    </div>

</body>

</html>
