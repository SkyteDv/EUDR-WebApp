<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer Overview</title>
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/header.css">
    <link rel="stylesheet" href="/css/account-menu.css">
    
    <link rel="stylesheet" href="/css/customer/c-suppliers-overview.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="/javascript/non-specific/account-menu.js" defer></script>
    <script src="/javascript/non-specific/customTableSearch.js" defer></script>
    <script src="\javascript\supplier\s-customer\s-sortTableHeaders.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="logo-container">
            <a href="/"><img src="/images/icons/logo_for_slides.png" class="logo" alt="HexaTrace Logo"></a>
            <h4>SUPPLIER</h4>
        </div>

        <div class="account-wrapper">
            <a href="#" id="account-toggle">
                👤 Hello <span th:text="${session.username}">Supplier</span> ▼
            </a>
            <div class="dropdown-menu" id="account-menu">
                <a href="/account">Profile</a>
                <a href="/settings">Settings</a>
                <form th:action="@{/user/logout}" method="post">
                    <button type="submit" class="dropdown-btn">Logout</button>
                </form>
            </div>
        </div>
    </header>

    <main class="supplier-page">
        <div class="section-header">
            <h1>Customer Overview</h1>

            <div class="global-actions">
                <label>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search Customers...">
                </label>
                <button id="refreshCustomersButton" class="clean-button" title="Refresh">
                    <i class="fas fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <div class="wrapper">
            <table class="delivery-table" id="customersTable">
                <thead>
                    <tr>
                        <th class="sortable">Customer Name</th>
                        <th class="sortable">Country</th>
                        <th class="sortable">Total Deliveries</th>
                        <th class="sortable">First Delivery</th>
                        <th class="sortable">Last Delivery</th>
                        <th class="sortable">DDS Yes</th>
                        <th class="sortable">DDS No</th>
                        <th class="sortable">DDS Denied</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="stat : ${customerStats}">
                        <td th:text="${stat.customerName}">Name</td>
                        <td th:text="${stat.country}">Country</td>
                        <td th:text="${stat.totalSharedDeliveries}">0</td>
                        <td th:text="${#temporals.format(stat.firstDeliveryDate, 'dd.MM.yyyy')}">01.01.2024</td>
                        <td th:text="${#temporals.format(stat.lastDeliveryDate, 'dd.MM.yyyy')}">01.01.2024</td>
                        <td th:text="${stat.ddsYes}">0</td>
                        <td th:text="${stat.ddsNo}">0</td>
                        <td th:text="${stat.ddsDenied}">0</td>
                        <td>
                            <a th:href="@{'/supplier/customers/details/' + ${stat.customerId}}" class="btn">
                                <i class="fas fa-eye"></i> View
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
