<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/index.css">
    <link rel="stylesheet" href="/css/non-specific/background-slideshow.css">
    <title>Homepage</title>
</head>

<body>

<div class="container">
    <div class="overlay"></div>
    <img class="fade-image" src="/images/palm%20oil.jpg" alt="Palm Oil">
    <img class="fade-image" src="/images/rainforest3.jpg" alt="Rainforest Image">
    <img class="fade-image" src="/images/rainforest1.jpg" alt="Rainforest Image">
    <img class="fade-image" src="/images/rainforest2.jpg" alt="Rainforest Image">
    <div class="content-container">
        <div id="heading-container">
            <img src="/images/icons/logo_for_slides.png" alt="Logo" class="logo-icon">
            <div class="text-content">
                <h1 class="heading">Folium</h1>
                <p class="slogan">Simplify Compliance. Maximize Trust</p>
            </div>
        </div>
        <div id="button-container">
            <button onclick="window.location.href='/user/login'" class="cssbuttons-io-button">
                Login
                <div class="icon">
                    <svg
                            height="24"
                            width="24"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                    >
                        <path d="M0 0h24v24H0z" fill="none"></path>
                        <path
                                d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                                fill="currentColor"
                        ></path>
                    </svg>
                </div>
            </button>
            <button onclick="window.location.href='/user/register'" class="cssbuttons-io-button">
                Sign Up
                <div class="icon">
                    <svg
                            height="24"
                            width="24"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                    >
                        <path d="M0 0h24v24H0z" fill="none"></path>
                        <path
                                d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
                                fill="currentColor"
                        ></path>
                    </svg>
                </div>
            </button>
        </div>
    </div>
</div>




</body>
