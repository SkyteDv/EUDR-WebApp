<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/background-slideshow.css">
    <link rel="stylesheet" href="/css/non-specific/registration-success.css">
    <title>Registration Success!</title>
</head>

<body>

<div class="container">
    <div class="overlay"></div>
    <img class="fade-image" src="/images/palm%20oil.jpg" alt="Palm Oil">
    <img class="fade-image" src="/images/rainforest3.jpg" alt="Rainforest Image">
    <img class="fade-image" src="/images/rainforest1.jpg" alt="Rainforest Image">
    <img class="fade-image" src="/images/rainforest2.jpg" alt="Rainforest Image">

    <div class="content-container">
        <h1>Your Registration was Successful!</h1>
        <p>Welcome, <span th:text="${username}">Username</span>!</p>
        <div id="button-container">
            <a class="clean-button" href="/user/login">Login</a>
            <a class="clean-button" href="/">Home</a>
        </div>
    </div>
</div>

</body>
</html>
