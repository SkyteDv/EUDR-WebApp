<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deliveries</title>
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/header.css">
    <link rel="stylesheet" href="/css/customer/c-deliveries.css">
    <link rel="stylesheet" href="/css/account-menu.css">
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<header class="header">
    <div class="logo-container">
        <a href="/"><img src="/images/logo_for_slides.png" class="logo" alt="HexaTrace Logo"></a>
        <h4>CUSTOMER</h4>
    </div>

    <nav class="navbar">
        <a href="/customer/dashboard" class="nav-link">Dashboard</a>
        <a href="/customer/suppliers/overview" class="nav-link">Suppliers</a>

        <a href="/customer/deliveries" class="nav-link active">Deliveries</a>
    </nav>

    <div class="account-wrapper">
        <a href="#" id="account-toggle">
            👤 Hello <span th:text="${session.username}">Benutzer</span> ▼
          </a>
        <div class="dropdown-menu" id="account-menu">
            <a href="/account">Profil</a>
            <a href="/settings">Einstellungen</a>
            <form th:action="@{/user/logout}" method="post">
                <button type="submit" class="dropdown-btn">Logout</button>
            </form>
        </div>
    </div>

    <div class="menu-toggle" id="menu-toggle">
        &#9776; <!-- unicode for ☰ -->
    </div>
</header>

<div class="main-content">
    <div class="deliveries-header">
        <h1>Deliveries</h1>
        <div class="search-filter">
            <label>
                <input type="text" data-table-id="ordersTable" class="search-input" placeholder="Search Deliveries..." id="searchInput">
            </label>
            <button id="refreshDeliveriesButton" class="clean-button">
                <i class="fas fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div class="deliveries-table">
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>Edit</th>
                    <th class="sortable" data-column="1">DDS on Delivery <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="2">DDS Ref <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="3">Shipment Ref <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="4">Destination <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="5">Status <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="6">Supplier <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="7">Order Date <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="8">Est. Delivery <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="9">Category <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="10">Product Name <span class="sort-icon"></span></th>
                    <th class="sortable" data-column="11">Dimensions (m²) <span class="sort-icon"></span></th>
                </tr>
                
            </thead>
            <tbody>
            <tr th:each="order : ${deliveries}">
                <!-- Edit Button -->
                <td data-label="Edit">
                    <button class="clean-button">
                        <i class="fas fa-pencil-alt"></i>
                    </button>
                </td>
                <td data-label="DDS on Delivery">
                    <span th:if="${order.ddsStatus == 'Yes'}" style="color: green; font-weight: bold;">Yes</span>
                    <span th:if="${order.ddsStatus == 'No'}" style="color: orange; font-weight: bold;">No</span>
                    <span th:if="${order.ddsStatus == 'Not Available'}" style="color: red; font-weight: bold;">NOT AVAILABLE</span>
                </td>
                <td data-label="DDS Ref">
                    <span th:if="${order.ddsReferenceNumber == ''}" style="color: red; font-weight: bold;">DENIED</span>
                    <span th:unless="${order.ddsReferenceNumber == ''}" th:text="${order.ddsReferenceNumber}"></span>
                </td>
                <td data-label="Shipment Ref" th:text="${order.erpReferenceNumber}"></td>
                <td data-label="Destination" th:text="${order.destination}"></td>
                <td data-label="Status" th:text="${order.status}"></td>
                <td data-label="Supplier">
                    <a th:href="@{/suppliers}" th:text="${order.supplier.username}"></a>
                </td>
                <td data-label="Order Date" th:text="${order.orderDate}"></td>
                <td data-label="Estimated Delivery" th:text="${order.estimatedDeliveryDate}"></td>
                <td data-label="Category" th:text="${order.productCategory}"></td>
                <td data-label="Product Name" th:text="${order.productName}"></td>
                <td data-label="Dimensions" th:text="${order.dimensions}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/javascript/customer/c-deliveries/c-sortTableHeaders.js"></script>
<script src="/javascript/supplier/s-deliveries/s-refreshDeliveries.js"></script>

<!--Search Algo Integration-->
<script src="/javascript/customer/c-deliveries/c-initializeDeliveryTableSearch.js"></script>
<script src="/javascript/non-specific/customTableSearch.js"></script>
<script src="/javascript/c-deliveries/c-searchTable.js"></script>
<script src="/javascript/c-deliveries/c-popup.js"></script>
<script src="/javascript/c-deliveries/c-sortTableHeaders.js"></script>
<script src="/javascript/c-deliveries/c-refreshDeliveries.js"></script>
<script src="/javascript/c-account-menu.js"></script>

<script>
    function editDelivery(ddsReferenceNumber) {
        // Here you can add functionality to edit the delivery,
        // such as opening a modal with the delivery's current data to update
        alert('Editing Delivery with Reference Number: ' + ddsReferenceNumber);
    }

    document.addEventListener("DOMContentLoaded", () => {
    const table = document.getElementById("ordersTable");
    let currentSortedCol = null;
    let currentDirection = "asc";

    table.querySelectorAll("th.sortable").forEach(header => {
        const icon = header.querySelector(".sort-icon");
        header.addEventListener("click", () => {
            const columnIndex = parseInt(header.getAttribute("data-column"));
            const tbody = table.querySelector("tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));
            const isSameColumn = columnIndex === currentSortedCol;
            currentDirection = isSameColumn && currentDirection === "asc" ? "desc" : "asc";

            rows.sort((a, b) => {
                const aText = a.children[columnIndex].textContent.trim();
                const bText = b.children[columnIndex].textContent.trim();

                // Falls Zahl, dann nach Zahl sortieren, sonst Alphabetisch
                const aNum = parseFloat(aText.replace(",", ".").replace("%", ""));
                const bNum = parseFloat(bText.replace(",", ".").replace("%", ""));

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return currentDirection === "asc" ? aNum - bNum : bNum - aNum;
                } else {
                    return currentDirection === "asc"
                        ? aText.localeCompare(bText)
                        : bText.localeCompare(aText);
                }
            });

            rows.forEach(row => tbody.appendChild(row));

            table.querySelectorAll("th.sortable").forEach(th => {
                th.classList.remove("sorted-asc", "sorted-desc");
                const icon = th.querySelector(".sort-icon");
                if (icon) icon.textContent = "";
            });

            if (icon) {
                icon.textContent = currentDirection === "asc" ? "↑" : "↓";
            }
            header.classList.add(currentDirection === "asc" ? "sorted-asc" : "sorted-desc");
            currentSortedCol = columnIndex;
        });
    });
});

</script>

</body>
</html>
