<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Suppliers</title>
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/customer/c-manage-suppliers.css">
    <link rel="stylesheet" href="/css/non-specific/header.css">
    <link rel="stylesheet" href="/css/customer/account-menu.css">
</head>

<body>

<!-- Header Section -->
<header class="header">
    <div class="logo-container">
        <a href="/"><img src="/images/logo_for_slides.png" class="logo" alt="HexaTrace Logo"></a>
        <h4>CUSTOMER</h4>
    </div>

    <nav class="navbar">
        <a href="/customer/dashboard" class="nav-link">Dashboard</a>
        <a href="/customer/suppliers" class="nav-link active">Suppliers</a>
        <a href="/customer/deliveries" class="nav-link">Deliveries</a>
    </nav>

        <div class="account-wrapper">
            <a href="#" id="account-toggle">
                👤 Hallo <span th:text="${session.username}">Benutzer</span> ▼
              </a>
            <div class="dropdown-menu" id="account-menu">
                <a href="/account">Profil</a>
                <a href="/settings">Einstellungen</a>
                <form th:action="@{/user/logout}" method="post">
                    <button type="submit" class="dropdown-btn">Logout</button>
                </form>
            </div>
        </div>



        <div class="menu-toggle" id="menu-toggle">
            &#9776; <!-- Unicode for ☰ -->
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="supplier-page">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search Suppliers..." id="search-suppliers" />
        </div>
    </main>

    <script src="script.js"></script> <!-- Placeholder for future JS -->
    <script src="/javascript/account-menu.js"></script>
</body>

</html>
