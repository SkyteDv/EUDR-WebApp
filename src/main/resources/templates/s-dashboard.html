<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/header.css">
    <link rel="stylesheet" href="/css/supplier/s-dashboard.css">
    <title>Homepage</title>
</head>

<body>

<header class="header">
    <div class="logo-container">
        <a href="/"><img src="/images/logo_for_slides.png" class="logo" alt="HexaTrace Logo"></a>
        <h4>SUPPLIER</h4>
    </div>

    <nav class="navbar">
        <a href="/supplier/dashboard" class="nav-link active">Dashboard</a>
        <a href="#" class="nav-link">Customers</a>
        <a href="/supplier/deliveries" class="nav-link">Deliveries</a>
    </nav>

    <div class="account-wrapper">
        <a href="#" id="account-toggle">
            👤 Hallo <span th:text="${session.username}">Benutzer</span> ▼
        </a>
        <div class="dropdown-menu" id="account-menu">
            <a href="/account">Profil</a>
            <a href="/settings">Einstellungen</a>
            <form th:action="@{/user/logout}" method="post">
                <button type="submit" class="dropdown-btn">Logout</button>
            </form>
        </div>
    </div>
</header>

<p>Homepage for the Supplier</p>

<main>

<div id="linechart" style="width: 100%; height: 500px; margin-top: 2rem;"></div>

<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {
        const data = google.visualization.arrayToDataTable([
            ['Date', 'Orders with DDS', 'Orders without DDS'],
            ['2025-05-01',  50,      10],
            ['2025-05-02',  60,      5],
            ['2025-05-03',  55,      8],
            ['2025-05-04',  70,      4],
            ['2025-05-05',  80,      3]
        ]);

        const options = {
            title: 'DDS Presence Over Time',
            curveType: 'function',
            legend: { position: 'bottom' }
        };

        const chart = new google.visualization.LineChart(document.getElementById('linechart'));
        chart.draw(data, options);
    }
</script>

</main>




<script src="/javascript/account-menu.js"></script>

</body>
</html>
