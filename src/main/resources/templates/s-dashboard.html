<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/header.css">

    <header class="header">
        <div class="logo-container">
            <a href="/supplier/dashboard"><img src="/images/icons/logo_for_slides.png" class="logo" alt="HexaTrace Logo"></a>
            <h4>SUPPLIER</h4>
        </div>

        
        <div class="account-wrapper">
            <a href="#" id="account-toggle">
                👤 Hello <span th:text="${session.username}">User</span> ▼
            </a>
            <div class="dropdown-menu" id="account-menu">
                <a href="/supplier/account">Profile</a>
                <a href="/supplier/settings">Settings</a>
                <form th:action="@{/user/logout}" method="post">
                    <button type="submit" class="dropdown-btn">Logout</button>
                </form>
            </div>
        </div>

    </header>
