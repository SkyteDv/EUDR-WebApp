<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliveries</title>
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/header.css">
    <link rel="stylesheet" href="/css/supplier/s-deliveries.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>

<header class="header">
    <div class="logo-container">
        <a href="/"><img src="/images/logo_for_slides.png" class="logo" alt="HexaTrace Logo"></a>
    </div>

    <nav class="navbar">
        <a href="/supplier/dashboard" class="nav-link">Dashboard</a>
        <a href="#" class="nav-link">Customers</a>
        <a href="/supplier/deliveries" class="nav-link active">Deliveries</a>
        <a href="#" class="nav-link">Account</a>
        <a href="#" class="nav-link">Settings</a>
    </nav>
</header>

<main class="page-content">
    <div class="section-header">
        <h1>Deliveries</h1>
        <div class="section-controls">
            <label>
                <input type="text" id="searchInput" class="search-input" placeholder="Search Deliveries...">
            </label>
            <button id="refreshDeliveriesButton" class="clean-button">
                <i class="fas fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div class="delivery-panels">
        <!-- Left Panel -->
        <section class="left-panel">
            <div class="panel-header">
                <h2>Active Deliveries</h2>
                <div class="search-filter-wrapper">
                    <label for="searchInputLeft"></label><input type="text" id="searchInputLeft" class="search-input" placeholder="Search Active Deliveries...">
                    <button id="filterActiveDeliv" class="clean-button">F</button>
                </div>
            </div>

            <div class="wrapper">
                <table class="delivery-table">
                    <thead>
                    <tr>
                        <th>Shipment Ref</th>
                        <th>DDS Ref</th>
                        <th>Customer</th>
                        <th>Order Date</th>
                        <th>Product Name</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Dynamically Loaded Rows -->
                    <tr th:each="order : ${activeDeliveries}" class="clickable-row"
                        th:onclick="|window.location='/supplier/deliveries/details/${order.id}'|">
                    <td th:text="${order.erpReferenceNumber}"></td>
                        <td th:text="${order.ddsReferenceNumber}"></td>
                        <td th:text="${order.customer.username}"></td>
                        <td th:text="${order.orderDate}"></td>
                        <td th:text="${order.productName}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Right Panel -->
        <section class="right-panel ">
            <div class="panel-header">
                <h2>Active Deliveries</h2>
                <div class="search-filter-wrapper">
                    <label for="searchInputLeft"></label><input type="text" id="searchInputRight" class="search-input" placeholder="Search Active Deliveries...">
                    <button id="filterAttachedDeliv" class="clean-button">F</button>
                </div>
            </div>

            <div class="wrapper">
                <div class="attached-cards-container">
                    <div class="attached-card" th:each="order : ${attachedDeliveries}">
                        <div class="right-card-internal-header">
                            <h3 th:text="'Shipment Ref: ' + ${order.erpReferenceNumber}"></h3>
                            <button class="details-button" th:onclick="|window.location='/supplier/deliveries/details/${order.id}'|" title="Details">
                                <span class="material-icons">library_books</span>
                            </button>






                        </div>
                        <p><strong>DDS Ref:</strong> <span th:text="${order.ddsReferenceNumber}"></span></p>
                        <p><strong>Customer:</strong> <span th:text="${order.customer.username}"></span></p>
                        <p><strong>Order Date:</strong> <span th:text="${order.orderDate}"></span></p>
                        <p><strong>Product:</strong> <span th:text="${order.productName}"></span></p>

                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="/javascript/refreshDeliveries.js"></script>

</body>
</html>
