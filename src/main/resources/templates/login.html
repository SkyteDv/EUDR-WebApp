<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Folium</title>
    <!-- Dark Mode Stylesheets -->
    <link rel="stylesheet" href="/css/non-specific/landing.css" disabled>
    <link rel="stylesheet" href="/css/non-specific/landingDesign.css" disabled>
    <link rel="stylesheet" href="/css/non-specific/login.css" disabled>
    <link rel="stylesheet" href="/css/non-specific/register.css" disabled>

    <!-- Light Mode Stylesheets -->
    <link rel="stylesheet" href="/css/non-specific/landingLightmode.css" id="light-css">
    <link rel="stylesheet" href="/css/non-specific/switch.css" id="switch-css">

    <link rel="icon" href="/images/icons/logo_for_slides.png" type="image/png">


    <script src="/javascript/non-specific/themeSwitcher.js" defer></script>


</head>

<body>
    <div class="slideshow-background">
        <img class="fade-image" src="/images/palm%20oil.jpg" alt="Palm Oil">
        <img class="fade-image" src="/images/rainforest3.jpg" alt="Rainforest Image">
        <img class="fade-image" src="/images/rainforest1.jpg" alt="Rainforest Image">
        <img class="fade-image" src="/images/rainforest2.jpg" alt="Rainforest Image">
        <div class="overlay"></div>
    </div>

    <header class="main-header">
        <div class="logo">
            <a href="/" class="logo-link">
                <img src="/images/icons/logo_for_slides.png" alt="Folium Logo" class="logo-image">
                <span class="logo-text">FOLIUM</span>
            </a>
        </div>
        <nav class="main-nav">
            <ul>
                <li>
                    <label class="theme-toggle">
                        <input type="checkbox" id="theme-switch">
                        <span class="slider"></span>
                    </label>
                </li>
                <li><a href="/">Home</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#features">Features</a></li>
                <li><a href="/#contact">Contact</a></li>
                <li><a href="/user/login" class="cta">Login</a></li>
                <li><a href="/user/register">Register</a></li>
            </ul>
        </nav>
    </header>


    <section class="hero-section" style="min-height: 100vh; justify-content: center;">
        <div class="login-form-container">
            <h2 style="color: #fff; margin-bottom: 1.5rem;">Login to your Account</h2>

            <!-- Error Message -->
            <div th:if="${loginError}" style="color: #ff8080; font-weight: bold; margin-bottom: 1rem;">
                <p th:text="${loginError}"></p>
            </div>

            <!-- Login Form -->
            <form th:action="@{/user/login}" th:object="${user}" method="post" class="login-form">
                <input type="text" class="input-field" th:field="*{username}" placeholder="Username" required>
                <input type="password" class="input-field" th:field="*{password}" placeholder="Password" required>

                <div class="forgot">
                    <label class="remember">
                        <input type="checkbox" name="rememberMe">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button class="btn-primary" type="submit">Sign In</button>

                <div class="sign-up-link" style="margin-top: 1.5rem;">
                    <p><a href="/">Cancel</a></p>
                    <p>Don't have an account? <a href="/user/register">Sign Up</a></p>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
