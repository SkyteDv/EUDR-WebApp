<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1>Login Page</h1>

<form th:action="@{/user/login}" th:object="${user}" method="post">
    <label for="username">Username:</label>
    <input type="text" th:field="*{username}" id="username" required/>

    <label for="password">Password:</label>
    <input type="password" th:field="*{password}" id="password" required/>

    <div th:if="${loginError}" class="error">
        <p th:text="${loginError}"></p>  <!-- Display the error message -->
    </div>

    <button type="submit">Login</button>
</form>

</body>
</html>
