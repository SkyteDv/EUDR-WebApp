<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/non-specific/global.css">
    <link rel="stylesheet" href="/css/non-specific/background-slideshow.css">
    <link rel="stylesheet" href="/css/non-specific/login.css">
</head>
<body>



<div class="container">
    <div class="overlay"></div>
    <img class="fade-image" src="/images/palm%20oil.jpg" alt="Palm Oil">
    <img class="fade-image" src="/images/rainforest3.jpg" alt="Rainforest Image">
    <img class="fade-image" src="/images/rainforest1.jpg" alt="Rainforest Image">
    <img class="fade-image" src="/images/rainforest2.jpg" alt="Rainforest Image">

    <div class="content-container">

        <div class="login-header">
            <h1>Login</h1>
        </div>


        <!-- Error Message -->
        <div th:if="${loginError}" style="color: red; font-weight: bold;">
            <p th:text="${loginError}"></p>
        </div>

        <!-- Login Form -->
        <form th:action="@{/user/login}" th:object="${user}" method="post">
            <!-- Email / Username Input -->
            <div class="input-box">
                <label>
                    <input type="text" class="input-field" th:field="*{username}" placeholder="Username" autocomplete="off" required>
                </label>
            </div>

            <!-- Password Input -->
            <div class="input-box">
                <label>
                    <input type="password" class="input-field" th:field="*{password}" placeholder="Password" autocomplete="off" required>
                </label>
            </div>

            <!-- Remember Me + Forgot Password -->
            <div class="forgot">
                <section>
                    <input type="checkbox" id="check" name="rememberMe">
                    <label for="check">Remember me</label>
                </section>
                <section>
                    <a href="#">Forgot password</a>
                </section>
            </div>

            <!-- Submit Button -->
            <div class="input-submit">
                <button class="submit-btn" type="submit" id="submit"></button>
                <label for="submit">Sign In</label>
            </div>

            <!-- Register Link -->
            <div class="sign-up-link">
                <p><a href="/">Cancel</a></p>
                <p>Don't have an account? <a href="/user/register">Sign Up</a></p>
            </div>
        </form>
    </div>
</div>

</body>
</html>
