<div th:if="${registerError}" style="color: red; font-weight: bold;">
    <p th:text="${registerError}"></p>
</div>
<!-- Form that posts to /register -->
<form th:action="@{/user/register}" th:object="${user}" method="post">
    <label for="username">Username:</label>
    <input type="text" th:field="*{username}" id="username" required />

    <label for="password">Password:</label>
    <input type="password" th:field="*{password}" id="password" required/>

    <label for="osapiensID">Osapiens ID:</label>
    <input type="text" th:field="*{osapiensID}" id="osapiensID" required>

    <label for="userType">Role:</label>
    <select th:field="*{userType}" id="userType" required>
        <option value="CUSTOMER">Customer</option>
        <option value="SUPPLIER">Supplier</option>
    </select>

    <button type="submit">Register</button>
</form>

<a href="/">Cancel</a>
<p>Already have an Account?</p>
<a href="/user/login">Login</a>
